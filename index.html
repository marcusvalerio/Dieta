<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Fuel</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root{
      --bg:#050505;
      --card:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.08);
      --text:#ffffff;
      --muted:#8d8d93;
      --green:#8CFF9D;
      --glass:blur(28px);
      --radius:28px;
    }
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }
    html,
    body{
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:'Inter', sans-serif;
      overflow-x:hidden;
    }
    body{
      background:
      radial-gradient(circle at top left, rgba(140,255,157,.12), transparent 25%),
      radial-gradient(circle at bottom right, rgba(255,255,255,.05), transparent 25%),
      #050505;
      padding:28px 18px 120px;
    }
    .app{
      max-width:520px;
      margin:auto;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }
    .title{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .title h1{
      font-family:'Bricolage Grotesque', sans-serif;
      font-size:42px;
      line-height:.9;
      letter-spacing:-2px;
      font-weight:800;
    }
    .title p{
      color:var(--muted);
      font-size:14px;
    }
    .profile{
      width:54px;
      height:54px;
      border-radius:50%;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:var(--glass);
    }
    .hero{
      position:relative;
      overflow:hidden;
      border-radius:38px;
      padding:28px;
      margin-bottom:20px;
      background:
      linear-gradient(145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(40px);
      box-shadow:
      0 10px 40px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.08);
    }
    .hero::before{
      content:'';
      position:absolute;
      width:220px;
      height:220px;
      border-radius:50%;
      background:rgba(140,255,157,.15);
      top:-80px;
      right:-60px;
      filter:blur(40px);
    }
    .hero small{
      color:var(--muted);
      font-size:13px;
    }
    .hero h2{
      font-family:'Bricolage Grotesque', sans-serif;
      font-size:72px;
      line-height:1;
      margin-top:8px;
      letter-spacing:-4px;
    }
    .hero span{
      font-size:18px;
      color:#d1d1d6;
    }
    .progress{
      margin-top:24px;
    }
    .progress-top{
      display:flex;
      justify-content:space-between;
      margin-bottom:12px;
      color:#d1d1d6;
      font-size:14px;
    }
    .bar{
      width:100%;
      height:14px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      overflow:hidden;
    }
    .bar div{
      width:72%;
      height:100%;
      border-radius:999px;
      background:
      linear-gradient(
      90deg,
      #8CFF9D,
      #D8FFE0
      );
      box-shadow:
      0 0 20px rgba(140,255,157,.4);
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-bottom:18px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      backdrop-filter:var(--glass);
      border-radius:30px;
      padding:22px;
    }
    .card p{
      color:var(--muted);
      font-size:13px;
      margin-bottom:10px;
    }
    .card h3{
      font-family:'Bricolage Grotesque', sans-serif;
      font-size:34px;
      letter-spacing:-2px;
    }
    .section{
      margin-top:22px;
    }
    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    }
    .section-title h4{
      font-family:'Bricolage Grotesque', sans-serif;
      font-size:28px;
      letter-spacing:-1px;
    }
    .section-title span{
      color:var(--muted);
      font-size:14px;
    }
    .meal{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      border-radius:28px;
      padding:20px;
      margin-bottom:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      transition:.3s ease;
    }
    .meal:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,.06);
    }
    .meal-info{
      display:flex;
      flex-direction:column;
      gap:5px;
    }
    .meal-info strong{
      font-size:18px;
      font-weight:600;
    }
    .meal-info span{
      color:var(--muted);
      font-size:13px;
    }
    .kcal{
      font-family:'Bricolage Grotesque', sans-serif;
      font-size:24px;
    }
    .shopping{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .shopping-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px;
      border-radius:24px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
    }
    .shopping-left{
      display:flex;
      align-items:center;
      gap:14px;
    }
    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--green);
      box-shadow:0 0 12px rgba(140,255,157,.7);
    }
    .shopping-left strong{
      font-size:16px;
    }
    .shopping-item span{
      color:var(--muted);
      font-size:13px;
    }
    .nav{
      position:fixed;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      width:92%;
      max-width:520px;
      background:rgba(20,20,20,.7);
      backdrop-filter:blur(30px);
      border:1px solid rgba(255,255,255,.08);
      border-radius:30px;
      padding:14px;
      display:flex;
      justify-content:space-around;
      z-index:999;
    }
    .nav button{
      background:none;
      border:none;
      color:#7c7c82;
      font-size:13px;
      font-weight:600;
      font-family:'Inter', sans-serif;
    }
    .nav button.active{
      color:white;
    }
  </style>
</head>
<body>
  <main class="app">
<div class="top">
  <div class="title">
    <p>Seu progresso hoje</p>
    <h1>Fuel</h1>
  </div>
  <div class="profile"></div>
</div>
<section class="hero">
  <small>Calorias consumidas</small>
  <h2>1.840 <span>kcal</span></h2>
  <div class="progress">
    <div class="progress-top">
      <span>Meta diária</span>
      <span>72%</span>
    </div>
    <div class="bar">
      <div></div>
    </div>
  </div>
</section>
<div class="grid">
  <div class="card">
    <p>Proteína</p>
    <h3>152g</h3>
  </div>
  <div class="card">
    <p>Água</p>
    <h3>3.1L</h3>
  </div>
</div>
<section class="section">
  <div class="section-title">
    <h4>Refeições</h4>
    <span>Hoje</span>
  </div>
  <div class="meal">
    <div class="meal-info">
      <strong>Café da manhã</strong>
      <span>Ovos + Banana + Aveia</span>
    </div>
    <div class="kcal">420</div>
  </div>
  <div class="meal">
    <div class="meal-info">
      <strong>Almoço</strong>
      <span>Frango + Arroz + Feijão</span>
    </div>
    <div class="kcal">720</div>
  </div>
  <div class="meal">
    <div class="meal-info">
      <strong>Jantar</strong>
      <span>Patinho + Legumes</span>
    </div>
    <div class="kcal">540</div>
  </div>
</section>
<section class="section">
  <div class="section-title">
    <h4>Compras</h4>
    <span>Essa semana</span>
  </div>
  <div class="shopping">
    <div class="shopping-item">
      <div class="shopping-left">
        <div class="dot"></div>
        <strong>Frango</strong>
      </div>
      <span>2kg</span>
    </div>
    <div class="shopping-item">
      <div class="shopping-left">
        <div class="dot"></div>
        <strong>Ovos</strong>
      </div>
      <span>30 un.</span>
    </div>
    <div class="shopping-item">
      <div class="shopping-left">
        <div class="dot"></div>
        <strong>Aveia</strong>
      </div>
      <span>1 pacote</span>
    </div>
  </div>
</section>
  </main>
  <nav class="nav">
<button class="active">Home</button>
<button>Dieta</button>
<button>Compras</button>
<button>Perfil</button>
  </nav>
</body>
</html>
