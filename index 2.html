<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Dieta"/>
<meta name="theme-color" content="#000000"/>
<link rel="manifest" href="./manifest.json"/>
<title>Plano Alimentar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--bg1:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.07);--glass3:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--border3:rgba(255,255,255,.22);
  --green:#30D158;--green-dim:rgba(48,209,88,.15);
  --blue:#0A84FF;--blue-dim:rgba(10,132,255,.15);
  --gold:#FFD60A;--gold-dim:rgba(255,214,10,.12);
  --rose:#FF453A;--rose-dim:rgba(255,69,58,.15);
  --purple:#BF5AF2;
  --text:#FFF;--text2:rgba(255,255,255,.72);--text3:rgba(255,255,255,.42);--text4:rgba(255,255,255,.22);
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
  --r:18px;--rs:12px;--rx:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* noise */
#app::before{content:'';position:fixed;inset:0;max-width:430px;margin:0 auto;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  background-size:180px;pointer-events:none;z-index:9999;opacity:.6}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;padding:calc(var(--safe-top) + 16px) 20px 0;
  background:rgba(0,0,0,.75);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
  border-bottom:.5px solid var(--border)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.hdr-greeting{font-size:12px;font-weight:300;color:var(--text3);margin-bottom:2px}
.hdr-title{font-size:22px;font-weight:600;color:var(--text);letter-spacing:-.5px;line-height:1.1}
.hdr-actions{display:flex;align-items:center;gap:10px}
.icon-btn{background:rgba(255,255,255,.07);border:.5px solid rgba(255,255,255,.12);border-radius:10px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;color:rgba(255,255,255,.6);transition:background .2s;flex-shrink:0}
.icon-btn:active{background:rgba(255,255,255,.14)}

/* RING */
.ring-wrap{position:relative;width:54px;height:54px;flex-shrink:0;cursor:pointer}
.ring-wrap svg{transform:rotate(-90deg);overflow:visible}
.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3.5}
.ring-fill{fill:none;stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.34,1.56,.64,1),stroke .4s}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-family:var(--mono);font-size:11px;font-weight:500;line-height:1}
.ring-lbl{font-size:7px;color:var(--text4);letter-spacing:.5px;line-height:1;margin-top:1px}

/* TABS */
.tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 0 0}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:72px;padding:11px 4px 12px;border:none;background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:9px;letter-spacing:.8px;color:var(--text4);
  border-bottom:1.5px solid transparent;margin-bottom:-.5px;transition:color .2s,border-color .2s;white-space:nowrap}
.tab-btn.active{color:var(--text);border-bottom-color:var(--text)}
.tab-icon{display:block;font-size:14px;margin-bottom:3px}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 40px)}

/* PAGE ANIM */
.page{animation:pageIn .35s cubic-bezier(.25,.46,.45,.94) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.s1{animation:pageIn .4s .05s ease both}.s2{animation:pageIn .4s .10s ease both}
.s3{animation:pageIn .4s .15s ease both}.s4{animation:pageIn .4s .20s ease both}
.s5{animation:pageIn .4s .25s ease both}

/* GLASS CARD */
.gc{background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:.5px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .3s,background .3s}
.gc.done{background:rgba(48,209,88,.06);border-color:rgba(48,209,88,.2)}
.gc-hdr{padding:14px 18px 12px;border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.gc.done .gc-hdr{border-bottom-color:rgba(48,209,88,.15)}
.gc-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--text)}
.gc-count{font-family:var(--mono);font-size:10px;color:var(--text4)}
.gc.done .gc-count{color:var(--green)}

/* FOOD ROW */
.frow{display:flex;align-items:center;gap:13px;padding:10px 18px;cursor:pointer;transition:background .15s;user-select:none;position:relative;overflow:hidden}
.frow:active{background:rgba(255,255,255,.02)}
.frow.ck{background:rgba(48,209,88,.04)}
.frow-inner{display:flex;align-items:center;gap:13px;flex:1;transition:transform .3s cubic-bezier(.25,.46,.45,.94)}

/* CHECKBOX */
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border3);background:transparent;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);position:relative}
.chk.on{border-color:var(--green);background:var(--green);transform:scale(1.05)}
.chk.cr{border-color:var(--blue)}
.chk svg{opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.chk.on svg{opacity:1;transform:scale(1)}
.chk-burst{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--green);opacity:0;pointer-events:none}
.chk.on .chk-burst{animation:burst .4s ease-out forwards}
@keyframes burst{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.6)}}

.fname{flex:1;font-size:14px;color:var(--text2);transition:all .25s;line-height:1.3}
.frow.ck .fname{color:var(--text4);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2)}
.fname.cr{color:var(--blue);font-style:italic}
.frow.ck .fname.cr{color:rgba(10,132,255,.3)}
.fqty{font-family:var(--mono);font-size:10px;color:var(--text4);flex-shrink:0}
.frow.ck .fqty{color:rgba(255,255,255,.15)}

/* SHOP ROW */
.sname{font-size:14px;color:var(--text2);transition:all .2s}
.frow.ck .sname{color:var(--text4);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2)}
.sqty{font-family:var(--mono);font-size:10px;color:var(--text4);flex-shrink:0;margin-left:8px}
.frow.ck .sqty{color:rgba(255,255,255,.15)}
.stip{font-family:var(--mono);font-size:9px;color:var(--text4);margin-top:2px}
.frow.ck .stip{color:rgba(255,255,255,.1)}

/* DONE BANNER */
.done-banner{text-align:center;padding:28px 20px;border-radius:var(--r);
  background:rgba(48,209,88,.07);border:.5px solid rgba(48,209,88,.2);margin-top:6px;
  animation:pageIn .4s ease both}
.done-banner .di{font-size:32px;margin-bottom:8px}
.done-banner .dt{font-size:16px;font-weight:600;color:var(--green);margin-bottom:4px;letter-spacing:-.3px}
.done-banner .ds{font-family:var(--mono);font-size:9px;color:rgba(48,209,88,.5);letter-spacing:2px}

/* STAT */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--glass);border:.5px solid var(--border);border-radius:var(--rs);padding:14px 16px;transition:transform .2s}
.stat:active{transform:scale(.98)}
.stat.full{grid-column:1/-1}
.stat.ag{background:rgba(48,209,88,.06);border-color:rgba(48,209,88,.18)}
.stat.au{background:rgba(255,214,10,.06);border-color:rgba(255,214,10,.18)}
.stat.ab{background:rgba(10,132,255,.06);border-color:rgba(10,132,255,.18)}
.sl{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--text4);text-transform:uppercase;margin-bottom:7px}
.sv{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--text);line-height:1;letter-spacing:-1px}
.sv.sm{font-size:18px}.sv.g{color:var(--green)}.sv.u{color:var(--gold)}.sv.b{color:var(--blue)}
.ss{font-size:11px;font-weight:300;color:var(--text4);margin-top:4px}

/* WEEK STRIP */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{border-radius:10px;border:.5px solid var(--border);background:var(--glass);
  padding:8px 3px 7px;text-align:center;cursor:pointer;transition:all .2s}
.wd.today{border-color:rgba(255,255,255,.3)}
.wd.complete{background:rgba(48,209,88,.1);border-color:rgba(48,209,88,.25)}
.wd.sel{border-color:var(--text);background:var(--glass2)}
.wd-n{font-family:var(--mono);font-size:7px;letter-spacing:.5px;color:var(--text4);text-transform:uppercase;margin-bottom:4px}
.wd.today .wd-n{color:var(--text3)}.wd.sel .wd-n{color:var(--text2)}.wd.complete .wd-n{color:rgba(48,209,88,.7)}
.wd-dot{width:4px;height:4px;border-radius:50%;background:var(--text4);margin:0 auto 3px}
.wd.today .wd-dot{background:rgba(255,255,255,.4)}.wd.complete .wd-dot{background:var(--green)}.wd.sel .wd-dot{background:var(--text)}
.wd-p{font-family:var(--mono);font-size:8px;color:var(--text4)}
.wd.complete .wd-p{color:var(--green)}.wd.sel .wd-p{color:var(--text2)}

/* PBAR */
.pbar-wrap{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.pbar-f{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.25,.46,.45,.94)}
.pbar-l{font-family:var(--mono);font-size:9px;color:var(--text4);white-space:nowrap}

/* TIMELINE */
.tl{position:relative;padding-left:28px}
.tl::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--border2)}
.tl-item{position:relative;margin-bottom:12px}
.tl-dot{position:absolute;left:-24px;top:14px;width:9px;height:9px;border-radius:50%;
  border:1.5px solid var(--border3);background:var(--bg1);transition:all .3s}
.tl-item.done .tl-dot{background:var(--green);border-color:var(--green)}
.tl-item.now .tl-dot{background:transparent;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,214,10,.15);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(255,214,10,.15)}50%{box-shadow:0 0 0 7px rgba(255,214,10,.04)}}
.tl-time{font-family:var(--mono);font-size:8px;color:var(--text4);margin-bottom:4px;letter-spacing:.5px}
.tl-item.now .tl-time{color:var(--gold)}

/* INSIGHT */
.insight{background:var(--gold-dim);border:.5px solid rgba(255,214,10,.2);border-radius:var(--rs);
  padding:13px 16px;display:flex;align-items:flex-start;gap:10px}
.ins-icon{font-size:16px;margin-top:1px;flex-shrink:0}
.ins-text{font-size:12px;color:rgba(255,214,10,.85);line-height:1.6;font-weight:300}
.ins-text strong{font-weight:600;color:var(--gold)}

/* DONUT */
.donut-wrap{display:flex;align-items:center;gap:16px}
.dl{flex:1;display:flex;flex-direction:column;gap:8px}
.dr{display:flex;align-items:center;gap:8px}
.d-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.d-name{font-family:var(--mono);font-size:9px;color:var(--text3);flex:1}
.d-val{font-family:var(--mono);font-size:9px;color:var(--text2)}

/* RECIPE */
.rc{background:var(--glass);border:.5px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s}
.rc-hdr{padding:14px 18px 12px;border-bottom:.5px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rc-name{font-size:14px;font-weight:500;color:var(--text);flex:1;letter-spacing:-.2px}
.rc-badges{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-top:1px}
.badge{font-family:var(--mono);font-size:8px;letter-spacing:.8px;padding:3px 8px;border-radius:5px;
  background:var(--glass2);border:.5px solid var(--border2);color:var(--text3)}
.badge.fr{background:var(--blue-dim);border-color:rgba(10,132,255,.2);color:var(--blue)}
.rc-body{padding:12px 18px 14px}
.rc-sec{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--text4);text-transform:uppercase;margin-bottom:7px;margin-top:12px}
.rc-sec:first-child{margin-top:0}
.rc-ingr{font-size:13px;color:var(--text3);line-height:1.8;font-weight:300}
.rc-step{display:flex;gap:12px;margin-bottom:8px;font-size:13px;color:var(--text2);line-height:1.55;font-weight:300}
.step-n{font-family:var(--mono);font-size:10px;color:var(--green);flex-shrink:0;margin-top:2px;width:14px}
.rc-tip{margin-top:10px;padding:10px 12px;background:rgba(255,214,10,.05);border-left:2px solid rgba(255,214,10,.3);
  border-radius:0 6px 6px 0;font-size:12px;color:var(--text3);font-style:italic;line-height:1.6;font-weight:300}
.rc-tog{width:100%;padding:11px;background:transparent;border:none;border-top:.5px solid var(--border);
  font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--text4);cursor:pointer;transition:color .2s,background .2s}
.rc-tog:hover{color:var(--text3);background:var(--glass)}
.fpill{flex-shrink:0;padding:6px 14px;border-radius:20px;border:.5px solid var(--border2);background:transparent;
  font-family:var(--mono);font-size:9px;letter-spacing:.8px;color:var(--text3);cursor:pointer;transition:all .2s;white-space:nowrap}
.fpill.on{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:var(--text)}

/* FINANCEIRO */
.fin-form{background:var(--glass);border:.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.fin-hdr{padding:13px 18px 11px;border-bottom:.5px solid var(--border);font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;justify-content:space-between}
.fin-body{padding:14px 18px}
.field{display:flex;flex-direction:column;gap:5px;flex:1}
.field label{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--text4);text-transform:uppercase}
.field input,.field select{background:rgba(255,255,255,.05);border:.5px solid var(--border2);border-radius:var(--rx);
  padding:9px 12px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;width:100%;-webkit-appearance:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:rgba(255,255,255,.35)}
.field select option{background:#111}
.frow2{display:flex;gap:8px;margin-bottom:10px}
.btn-p{width:100%;padding:12px;background:rgba(255,255,255,.1);border:.5px solid var(--border3);border-radius:var(--rx);
  color:var(--text);font-family:var(--mono);font-size:10px;letter-spacing:1.5px;cursor:pointer;transition:background .2s,transform .1s}
.btn-p:active{transform:scale(.98);background:rgba(255,255,255,.14)}
.btn-g{padding:7px 14px;background:transparent;border:.5px solid var(--border2);border-radius:var(--rx);
  color:var(--text4);font-family:var(--mono);font-size:9px;cursor:pointer;transition:all .2s}
.btn-g:hover{color:var(--text3);border-color:var(--border3)}
.pi-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:.5px solid var(--border)}
.pi-row:last-child{border-bottom:none}
.pi-name{font-size:13px;color:var(--text2)}
.pi-cat{font-family:var(--mono);font-size:9px;color:var(--text4);margin-top:2px}
.pi-val{font-family:var(--mono);font-size:12px;color:var(--gold);flex-shrink:0;margin-left:10px}
.pi-del{background:none;border:none;color:var(--text4);font-size:18px;cursor:pointer;padding:0 0 0 8px;line-height:1;transition:color .2s}
.pi-del:hover{color:var(--rose)}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-family:var(--mono);font-size:7px;color:var(--text4);text-align:center;padding-bottom:5px;text-transform:uppercase}
.cal-day{aspect-ratio:1;border-radius:8px;border:.5px solid transparent;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s}
.cal-day.today{border-color:rgba(255,255,255,.25)}.cal-day.has-p{background:rgba(48,209,88,.08);border-color:rgba(48,209,88,.2)}
.cal-day.sel{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}.cal-day.empty{cursor:default}
.cal-n{font-family:var(--mono);font-size:10px;color:var(--text4);line-height:1}
.cal-day.today .cal-n{color:var(--text)}.cal-day.has-p .cal-n{color:var(--green)}.cal-day.sel .cal-n{color:var(--text)}
.cal-dot{width:3px;height:3px;border-radius:50%;background:var(--green)}
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-m-lbl{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--text3);text-transform:uppercase}
.cal-nav-btns{display:flex;gap:6px}
.cal-nb{background:transparent;border:.5px solid var(--border2);border-radius:6px;color:var(--text3);
  font-family:var(--mono);font-size:12px;padding:3px 10px;cursor:pointer;transition:all .2s}
.cal-nb:hover{border-color:var(--border3);color:var(--text)}

/* CAT BARS */
.cb-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cb-name{font-family:var(--mono);font-size:9px;color:var(--text3);width:65px;flex-shrink:0;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-track{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.cb-fill{height:100%;border-radius:2px;transition:width .6s ease;background:var(--gold)}
.cb-val{font-family:var(--mono);font-size:9px;color:var(--text3);width:56px;text-align:right;flex-shrink:0}

/* WEIGHT */
.w-row{display:flex;align-items:center;gap:8px}
.w-row input{background:rgba(255,255,255,.05);border:.5px solid var(--border2);border-radius:var(--rx);
  padding:10px 12px;color:var(--text);font-family:var(--mono);font-size:15px;outline:none;width:110px;-webkit-appearance:none;transition:border-color .2s}
.w-row input:focus{border-color:rgba(255,255,255,.35)}
.w-unit{font-family:var(--mono);font-size:11px;color:var(--text4);margin-bottom:0}
.wlog-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:.5px solid var(--border)}
.wlog-row:last-child{border-bottom:none}
.wlog-d{font-family:var(--mono);font-size:10px;color:var(--text4)}
.wlog-r{display:flex;align-items:center;gap:10px}
.wlog-v{font-family:var(--mono);font-size:12px;color:var(--text2)}
.wlog-del{background:none;border:none;color:var(--text4);font-size:16px;cursor:pointer;padding:0;line-height:1;transition:color .2s}
.wlog-del:hover{color:var(--rose)}

/* EVAL */
.eval-opt{padding:7px 14px;border-radius:20px;border:.5px solid var(--border2);background:transparent;font-size:13px;cursor:pointer;transition:all .2s;flex-shrink:0}
.eval-opt.on{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.eval-opts{display:flex;gap:7px;flex-wrap:wrap}
.eval-lbl{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--text4);text-transform:uppercase;margin-bottom:7px}

/* PREP */
.prep-ctrl{display:flex;align-items:center;gap:10px}
.prep-n{font-family:var(--mono);font-size:15px;color:var(--text);min-width:22px;text-align:center}
.prep-btn{width:28px;height:28px;border-radius:7px;border:.5px solid var(--border2);background:transparent;
  color:var(--text3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.prep-btn:active{background:var(--glass2);transform:scale(.9)}

/* EMPTY */
.empty{text-align:center;padding:32px 20px}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.35;display:block}
.empty-title{font-size:14px;font-weight:500;color:var(--text3);margin-bottom:5px}
.empty-sub{font-family:var(--mono);font-size:10px;color:var(--text4);line-height:1.7}

/* INSTALL */
.install{background:var(--blue-dim);border:.5px solid rgba(10,132,255,.25);border-radius:var(--rs);
  padding:12px 14px;display:flex;align-items:center;gap:10px}
.install-t{flex:1;font-size:12px;color:rgba(10,132,255,.9);line-height:1.4}
.install-x{background:none;border:none;color:var(--text4);font-size:20px;cursor:pointer;padding:0;line-height:1;flex-shrink:0}

/* SEARCH */
.s-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);backdrop-filter:blur(30px);
  padding:calc(var(--safe-top) + 20px) 20px;animation:pageIn .2s ease both}
.s-bar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:.5px solid var(--border2);
  border-radius:var(--rs);padding:10px 14px;margin-bottom:16px}
.s-bar input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--sans);font-size:15px}
.s-bar input::placeholder{color:var(--text4)}
.s-res{padding:11px 14px;border-radius:var(--rx);cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:12px}
.s-res:hover{background:rgba(255,255,255,.05)}
.s-res-name{font-size:13px;color:var(--text2)}
.s-res-meta{font-family:var(--mono);font-size:9px;color:var(--text4);margin-top:2px}

/* CONFETTI */
.cnf-wrap{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.cnf{position:absolute;width:8px;height:8px;top:-10px;border-radius:2px;animation:fall linear both}
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}80%{opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* MILESTONE */
.ms-overlay{position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ms-card{background:var(--bg2);border:.5px solid var(--border2);border-radius:var(--r);
  padding:32px 28px;margin:20px;text-align:center;max-width:320px;width:100%;
  animation:slideUp .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.ms-icon{font-size:48px;margin-bottom:14px;display:block}
.ms-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:6px;letter-spacing:-.4px}
.ms-sub{font-size:13px;color:var(--text3);font-weight:300;line-height:1.6;margin-bottom:20px}
.ms-close{width:100%;padding:12px;background:rgba(48,209,88,.15);border:.5px solid rgba(48,209,88,.3);
  border-radius:var(--rx);color:var(--green);font-family:var(--mono);font-size:10px;letter-spacing:1.5px;cursor:pointer;transition:background .2s}
.ms-close:hover{background:rgba(48,209,88,.22)}

/* HIST */
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:.5px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-wk{font-family:var(--mono);font-size:10px;color:var(--text3)}
.hist-val{font-family:var(--mono);font-size:11px;color:var(--gold)}

/* UTILS */
.pad{padding:16px 18px}
.pad0{padding-top:0}
.gap{height:12px}.gap-lg{height:20px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

// ══════════════════ HELPERS ══════════════════
function dayProg(dayName){
  const dm=MEALS[dayName];let tot=0,done=0;
  MO.forEach(m=>dm[m].forEach((_,i)=>{tot++;if(S.checked[`${dayName}__${m}__${i}`])done++;}));
  return tot===0?0:Math.round(done/tot*100);
}

function greeting(){
  const h=new Date().getHours();
  if(h<12)return 'Bom dia ☀️';if(h<18)return 'Boa tarde 🌤️';return 'Boa noite 🌙';
}

function streak(){
  let s=0;const d=new Date();
  for(let i=0;i<365;i++){
    const idx=d.getDay()===0?6:d.getDay()-1;
    if(dayProg(DAYS[idx])===100){s++;d.setDate(d.getDate()-1);}
    else if(i===0){d.setDate(d.getDate()-1);}else break;
  }
  return s;
}

function ringHTML(pct,col){
  const r=23,c=2*Math.PI*r,off=c-(pct/100)*c;
  const color=col||(pct===100?'#30D158':pct>60?'#FFD60A':'#FFF');
  return `<div class="ring-wrap" onclick="setTab('dieta')">
    <svg width="54" height="54" viewBox="0 0 54 54">
      <circle class="ring-bg" cx="27" cy="27" r="${r}"/>
      <circle class="ring-fill" cx="27" cy="27" r="${r}" stroke="${color}"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>
    <div class="ring-center">
      <div class="ring-pct" style="color:${color}">${pct}%</div>
      <div class="ring-lbl">hoje</div>
    </div>
  </div>`;
}

function chk(on,cr){
  return `<div class="chk${on?' on':''}${cr&&!on?' cr':''}">
    <div class="chk-burst"></div>
    <svg width="10" height="8" viewBox="0 0 11 9" fill="none">
      <path d="M1 4L4 7.5L10 1" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>`;
}

function tabsHTML(active){
  const items=[['dashboard','📊','Overview'],['dieta','🍽️','Dieta'],['compras','🛒','Compras'],['receitas','📖','Receitas'],['financeiro','💰','Finanças']];
  return `<div class="tabs">${items.map(([id,ic,lb])=>
    `<button class="tab-btn${active===id?' active':''}" onclick="setTab('${id}')"><span class="tab-icon">${ic}</span>${lb}</button>`
  ).join('')}</div>`;
}

function hdr(title,ringHtml,activeTab){
  const pct=dayProg(DAYS[todayIdx()]);
  const r=ringHtml||ringHTML(pct);
  return `<div class="hdr">
    <div class="hdr-top">
      <div><div class="hdr-greeting">${greeting()}</div><div class="hdr-title">${title}</div></div>
      <div class="hdr-actions">
        <button class="icon-btn" onclick="set({showSearch:true})">🔍</button>
        ${r}
      </div>
    </div>
    ${tabsHTML(activeTab)}
  </div>`;
}

function pbar(pct,col){
  return `<div class="pbar"><div class="pbar-f" style="width:${pct}%;background:${col||'#30D158'}"></div></div>`;
}

function insight(){
  const sk=streak(),ws=[...S.weights].sort((a,b)=>b.date.localeCompare(a.date));
  if(sk>=7)return{icon:'🔥',text:`Streak de <strong>${sk} dias</strong>! Você está construindo um hábito real.`};
  if(ws.length>=2){const d=(ws[0].val-ws[ws.length-1].val).toFixed(1);if(parseFloat(d)<0)return{icon:'📉',text:`Você perdeu <strong>${Math.abs(d)}kg</strong> no período. Ótima progressão!`};}
  const skip={};MO.forEach(m=>{skip[m]=DAYS.filter(d=>MEALS[d][m].every((_,i)=>!S.checked[`${d}__${m}__${i}`])).length;});
  const mm=Object.entries(skip).sort((a,b)=>b[1]-a[1])[0];
  if(mm&&mm[1]>=3)return{icon:'💡',text:`Você tende a pular <strong>${mm[0]}</strong> com frequência. Prepare com antecedência!`};
  const p=dayProg(DAYS[todayIdx()]);
  if(p===100)return{icon:'✅',text:`Dieta 100% completa hoje. Excelente!`};
  if(p>0)return{icon:'⚡',text:`Você está <strong>${p}%</strong> do caminho. Falta pouco!`};
  return{icon:'🎯',text:`Marque as refeições conforme for fazendo. Pequenos hábitos constroem grandes resultados.`};
}

function donut(){
  const d=DAYS[todayIdx()],m=MEALS[d];
  let prot=0,carb=0,fat=0;
  MO.forEach(meal=>m[meal].forEach((f,i)=>{
    if(!S.checked[`${d}__${meal}__${i}`])return;
    const n=f.item.toLowerCase();
    if(n.includes('frango')||n.includes('ovo')||n.includes('atum')||n.includes('iogurte'))prot++;
    else if(n.includes('arroz')||n.includes('batata')||n.includes('pão')||n.includes('aveia')||n.includes('banana')||n.includes('macarrão')||n.includes('tapioca'))carb++;
    else fat+=.5;
  }));
  const tot=prot+carb+fat||1;
  const pp=Math.round(prot/tot*100),cp=Math.round(carb/tot*100),fp=100-pp-cp;
  const cols=['#30D158','#0A84FF','#FFD60A'],labs=['Proteína','Carboidrato','Gordura'],vals=[pp,cp,fp];
  const r=36,circ=2*Math.PI*r;let off=0;
  const arcs=vals.map((v,i)=>{const l=(v/100)*circ;const a=`<circle cx="46" cy="46" r="${r}" fill="none" stroke="${cols[i]}" stroke-width="10" stroke-linecap="butt" stroke-dasharray="${l.toFixed(1)} ${(circ-l).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;off+=l;return a;}).join('');
  const legend=labs.map((l,i)=>`<div class="dr"><div class="d-dot" style="background:${cols[i]}"></div><div class="d-name">${l}</div><div class="d-val">${vals[i]}%</div></div>`).join('');
  return `<div class="donut-wrap"><svg width="92" height="92" viewBox="0 0 92 92" style="transform:rotate(-90deg)"><circle cx="46" cy="46" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="10"/>${arcs}</svg><div class="dl">${legend}</div></div>`;
}

function drawChart(){
  const canvas=document.getElementById('wc');if(!canvas)return;
  const wts=[...S.weights].sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);
  if(wts.length<2){canvas.style.display='none';return;}
  canvas.style.display='block';
  const dpr=window.devicePixelRatio||1,W=canvas.offsetWidth,H=120;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const vals=wts.map(w=>w.val),mn=Math.min(...vals)-.5,mx=Math.max(...vals)+.5;
  const px=i=>(i/(wts.length-1))*(W-32)+16;
  const py=v=>H-16-((v-mn)/(mx-mn))*(H-32);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(48,209,88,.18)');g.addColorStop(1,'rgba(48,209,88,0)');
  ctx.beginPath();ctx.moveTo(px(0),H-16);
  wts.forEach((w,i)=>ctx.lineTo(px(i),py(w.val)));
  ctx.lineTo(px(wts.length-1),H-16);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();wts.forEach((w,i)=>i===0?ctx.moveTo(px(i),py(w.val)):ctx.lineTo(px(i),py(w.val)));
  ctx.strokeStyle='#30D158';ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
  wts.forEach((w,i)=>{
    ctx.beginPath();ctx.arc(px(i),py(w.val),3.5,0,Math.PI*2);ctx.fillStyle='#30D158';ctx.fill();
    ctx.beginPath();ctx.arc(px(i),py(w.val),1.5,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.font=`500 9px 'DM Mono',monospace`;ctx.textAlign='center';
    ctx.fillText(w.val+'kg',px(i),py(w.val)-7);
    if(i===0||i===wts.length-1){ctx.fillStyle='rgba(255,255,255,.22)';ctx.font=`300 8px 'DM Mono',monospace`;ctx.fillText(fmtDate(w.date),px(i),H-2);}
  });
}

function confetti(){
  const c=document.createElement('div');c.className='cnf-wrap';document.body.appendChild(c);
  const cols=['#30D158','#FFD60A','#0A84FF','#BF5AF2','#FF453A','#FFF'];
  for(let i=0;i<55;i++){
    const p=document.createElement('div');p.className='cnf';
    p.style.cssText=`left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.4}s;transform:rotate(${Math.random()*360}deg);border-radius:${Math.random()>.5?'50%':'2px'};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;`;
    c.appendChild(p);
  }
  setTimeout(()=>c.remove(),4000);

}

function checkMilestone(){
  const sk=streak();
  const ms=[{n:7,icon:'🔥',title:'1 semana seguida!',msg:'7 dias de dieta consistente. Você está criando um hábito real.'},{n:14,icon:'💪',title:'2 semanas!',msg:'14 dias sem parar. Isso é disciplina de verdade.'},{n:30,icon:'🏆',title:'1 mês completo!',msg:'30 dias. Você transformou a dieta num estilo de vida.'}];
  const m=ms.find(m=>sk>=m.n&&!S.milestones[m.n]);
  if(!m)return '';
  set({milestones:{...S.milestones,[m.n]:true}});
  return `<div class="ms-overlay" id="ms">
    <div class="ms-card"><span class="ms-icon">${m.icon}</span><div class="ms-title">${m.title}</div>
    <div class="ms-sub">${m.msg}</div><button class="ms-close" onclick="document.getElementById('ms').remove()">CONTINUAR</button></div>

}

function weekStrip(selDay,clickable){

function rDieta(){

  const mMins=m=>{const[h,mn]=MT[m].split(':').map(Number);return h*60+mn};
  const isToday=S.day===todayIdx();
  const mCards=MO.map(meal=>{
    const items=meals[meal],done=items.filter((_,i)=>S.checked[`${day}__${meal}__${i}`]).length;
    const allDone=done===items.length,mm=mMins(meal);
    const isCur=isToday&&nowMins>=mm-30&&nowMins<=mm+90;

}

// ══════════════════ FINANCEIRO ══════════════════
function rFinanceiro(){
  const ps=S.purchases,now=new Date();
  const wkStart=new Date(now);wkStart.setDate(now.getDate()-now.getDay()+(now.getDay()===0?-6:1));wkStart.setHours(0,0,0,0);
  const wkPs=ps.filter(p=>new Date(p.date+'T00:00:00')>=wkStart);
  const wkTot=wkPs.reduce((a,p)=>a+p.val,0),allTot=ps.reduce((a,p)=>a+p.val,0);
  const mPct=Math.min(Math.round(wkTot/S.finMeta*100),100),mCol=mPct>90?'#FF453A':mPct>70?'#FFD60A':'#30D158';
  const catTots={};wkPs.forEach(p=>{catTots[p.cat]=(catTots[p.cat]||0)+p.val});
  const maxC=Math.max(...Object.values(catTots),1);
  const wkMap={};
  ps.forEach(p=>{const d=new Date(p.date+'T00:00:00'),ws=new Date(d);ws.setDate(d.getDate()-d.getDay()+(d.getDay()===0?-6:1));const wk=`${ws.getFullYear()}-${p2(ws.getMonth()+1)}-${p2(ws.getDate())}`;wkMap[wk]=(wkMap[wk]||0)+p.val;});
  const sWks=Object.entries(wkMap).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);
  const sd=new Date(S.finDate+'T00:00:00'),y=sd.getFullYear(),m=sd.getMonth();
  const fd=new Date(y,m,1).getDay(),off=fd===0?6:fd-1,dim=new Date(y,m+1,0).getDate();
  const mNms=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const pDates=new Set(ps.map(p=>p.date)),tod=today();
  let cells='';for(let i=0;i<off;i++)cells+=`<div class="cal-day empty"></div>`;
  for(let d2=1;d2<=dim;d2++){const ds=`${y}-${p2(m+1)}-${p2(d2)}`;cells+=`<div class="cal-day${ds===tod?' today':''}${pDates.has(ds)?' has-p':''}${ds===S.finDate?' sel':''}" onclick="setFinDate('${ds}')"><div class="cal-n">${d2}</div>${pDates.has(ds)?'<div class="cal-dot"></div>':''}</div>`;}
  const selPs=ps.filter(p=>p.date===S.finDate),selTot=selPs.reduce((a,p)=>a+p.val,0);
  const pList=selPs.length===0?`<div class="empty"><span class="empty-icon">📋</span><div class="empty-title">Nenhum lançamento</div><div class="empty-sub">Nenhum gasto registrado neste dia ainda</div></div>`
    :selPs.map(p=>`<div class="pi-row"><div><div class="pi-name">${p.name}</div><div class="pi-cat">${p.cat}</div></div><div style="display:flex;align-items:center"><div class="pi-val">${fmtBRL(p.val)}</div><button class="pi-del" onclick="deletePurchase('${p.id}')">×</button></div></div>`).join('');
  const cBars=Object.entries(catTots).sort((a,b)=>b[1]-a[1]).map(([cat,val])=>`<div class="cb-row"><div class="cb-name">${cat.replace(/^[^\s]+\s/,'')}</div><div class="cb-track"><div class="cb-fill" style="width:${Math.round(val/maxC*100)}%"></div></div><div class="cb-val">${fmtBRL(val)}</div></div>`).join('');
  const f=S.finForm;
  return hdr('Financeiro',ringHTML(mPct,mCol),'financeiro')+
  `<div class="scroll page">
    <div class="pad">
      <div class="sgrid">
        <div class="stat${mPct>90?' ar':mPct>70?' au':' ag'}"><div class="sl">Esta semana</div>
          <div class="sv sm" style="color:${mCol}">${fmtBRL(wkTot)}</div>
          <div style="margin-top:6px">${S.finMetaEdit
            ?`<div style="display:flex;gap:6px;align-items:center"><input type="number" value="${S.finMeta}" id="meta-inp" style="background:rgba(255,255,255,.07);border:.5px solid rgba(255,255,255,.2);border-radius:6px;padding:5px 8px;color:var(--text);font-family:var(--mono);font-size:11px;outline:none;width:80px"/><button onclick="saveMeta()" style="padding:5px 10px;background:rgba(48,209,88,.15);border:.5px solid rgba(48,209,88,.3);border-radius:6px;color:#30D158;font-family:var(--mono);font-size:9px;cursor:pointer">OK</button></div>`
            :`<div style="font-family:var(--mono);font-size:9px;color:var(--text4);cursor:pointer" onclick="set({finMetaEdit:true})">Meta: ${fmtBRL(S.finMeta)} <span style="color:rgba(255,255,255,.35)">editar</span></div>`}
          </div>
        </div>
        <div class="stat"><div class="sl">Total geral</div><div class="sv sm">${fmtBRL(allTot)}</div><div class="ss">${ps.length} lançamentos</div></div>
      </div>
    </div>
    ${Object.keys(catTots).length?`<div class="pad pad0"><div class="sl" style="margin-bottom:10px">Por categoria · semana</div><div class="gc" style="padding:14px 18px">${cBars}</div></div>`:''}
    <div class="pad pad0">
      <div class="cal-nav-row"><div class="cal-m-lbl">${mNms[m]} ${y}</div><div class="cal-nav-btns"><button class="cal-nb" onclick="prevMonth()">‹</button><button class="cal-nb" onclick="nextMonth()">›</button></div></div>
      <div class="cal-grid">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    </div>
    <div class="pad pad0">
      <div class="fin-form">
        <div class="fin-hdr"><span>+ ${S.finDate.split('-').reverse().join('/')}</span>${selTot>0?`<span style="font-family:var(--mono);font-size:11px;color:var(--gold)">${fmtBRL(selTot)}</span>`:''}</div>
        <div class="fin-body">
          <div class="frow2">
            <div class="field" style="flex:2"><label>Item</label><input type="text" id="fn" value="${f.name}" placeholder="ex: Peito de frango" oninput="updateFinForm('name',this.value)"/></div>
            <div class="field"><label>R$</label><input type="number" id="fv" value="${f.val}" placeholder="0,00" min="0" step="0.01" oninput="updateFinForm('val',this.value)"/></div>
          </div>
          <div class="frow2"><div class="field"><label>Categoria</label><select id="fc" onchange="updateFinForm('cat',this.value)">${FCATS.map(c=>`<option value="${c}"${f.cat===c?' selected':''}>${c}</option>`).join('')}</select></div></div>
          <button class="btn-p" onclick="addPurchase()">ADICIONAR</button>
        </div>
        <div style="padding:0 18px 14px">${pList}</div>
      </div>
    </div>
    ${sWks.length?`<div class="pad pad0"><div class="sl" style="margin-bottom:10px">Histórico semanal</div><div class="gc" style="padding:4px 18px">${sWks.map(([wk,val])=>{const d3=new Date(wk+'T00:00:00');return `<div class="hist-row"><div class="hist-wk">Semana ${p2(d3.getDate())}/${p2(d3.getMonth()+1)}</div><div style="display:flex;align-items:center;gap:10px"><div class="hist-val">${fmtBRL(val)}</div><div style="font-family:var(--mono);font-size:9px;color:${val>S.finMeta?'#FF453A':'#30D158'}">${val>S.finMeta?'acima':'ok'}</div></div></div>`;}).join('')}</div></div>`:''}
  </div>`;
}

// ══════════════════ PESO ══════════════════
function rPeso(){
  const sorted=[...S.weights].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
  const log=sorted.length===0
    ?`<div class="empty"><span class="empty-icon">⚖️</span><div class="empty-title">Nenhum registro ainda</div><div class="empty-sub">O primeiro passo é sempre<br>o mais importante.</div></div>`
    :sorted.map((w,i)=>{const nx=sorted[i+1],diff=nx?(w.val-nx.val).toFixed(1):null;return `<div class="wlog-row"><div class="wlog-d">${fmtDate(w.date)}</div><div class="wlog-r">${diff!==null?`<div class="wlog-diff" style="color:${parseFloat(diff)<=0?'#30D158':'#FF453A'}">${parseFloat(diff)<=0?'▼':'▲'}${Math.abs(diff)}kg</div>`:''}<div class="wlog-v">${w.val} kg</div><button class="wlog-del" onclick="deleteWeight('${w.date}')">×</button></div></div>`;}).join('');
  return hdr('Peso & Evolução','','dieta')+
  `<div class="scroll page">
    <div class="pad"><div class="sl" style="margin-bottom:10px">Registrar</div>
      <div class="w-row"><input type="number" step="0.1" min="40" max="300" placeholder="103.5" value="${S.wIn}" oninput="set({wIn:this.value})" id="w-inp"/><div class="w-unit" style="margin:0 0 0 4px">kg</div><button class="btn-p" style="flex:1;padding:10px;margin-left:8px" onclick="addWeight()">Registrar</button></div>
    </div>
    <div class="pad pad0"><div class="sl" style="margin-bottom:10px">Evolução</div>
      <div class="gc" style="padding:14px 18px">
        ${S.weights.length<2?`<div style="text-align:center;padding:24px 0"><span style="font-size:28px;opacity:.35;display:block;margin-bottom:8px">📈</span><div style="font-family:var(--mono);font-size:10px;color:var(--text4);line-height:2">Registre ao menos 2 pesagens<br>para ver o gráfico</div></div>`:`<canvas id="wc" style="width:100%;height:120px"></canvas>`}
      </div>
    </div>
    <div class="pad pad0"><div class="sl" style="margin-bottom:10px">Histórico</div><div class="gc" style="padding:4px 18px">${log}</div></div>
  </div>`;
}

// ══════════════════ MEAL PREP ══════════════════
function rMealPrep(){
  const done=PREPS.filter(i=>(S.prepStock[i.name]||0)>0).length,pct=Math.round(done/PREPS.length*100);
  const cards=PREPS.map(item=>{
    const qty=S.prepStock[item.name]||0,isDone=qty>0;
    return `<div class="gc${isDone?' done':''}" style="margin-bottom:8px">
      <div style="padding:12px 18px;display:flex;align-items:center;justify-content:space-between">
        <div><div style="font-size:13px;font-weight:500;color:${isDone?'#30D158':'var(--text2)'};">${item.name}</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--text4);margin-top:3px">${item.unit}</div></div>
        <div class="prep-ctrl">
          <button class="prep-btn" onclick="adjPrep('${item.name}',-1)">−</button>
          <div class="prep-n">${qty}</div>
          <button class="prep-btn" onclick="adjPrep('${item.name}',1)">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
  return hdr('Meal Prep','','dieta')+
  `<div class="scroll page">
    <div class="pad"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div><div class="sl">Estoque preparado</div><div style="font-family:var(--mono);font-size:16px;color:var(--text)">${done}/${PREPS.length} <span style="color:var(--text4)">itens</span></div></div><div style="font-family:var(--mono);font-size:13px;color:${pct===100?'#30D158':'var(--text3)'}">${pct}%</div></div>
    <div class="pbar-wrap">${pbar(pct,pct===100?'#30D158':'#0A84FF')}</div></div>
    <div class="pad pad0">${cards}<button class="btn-g" onclick="clearPrep()" style="width:100%;margin-top:4px">Zerar estoque</button></div>
  </div>`;
}

// ══════════════════ RENDER ══════════════════
function render(){
  const map={dashboard:rDashboard,dieta:rDieta,compras:rCompras,receitas:rReceitas,financeiro:rFinanceiro,peso:rPeso,mealprep:rMealPrep};
  document.getElementById('app').innerHTML=(map[S.tab]||rDashboard)();
  if(S.showSearch){document.getElementById('app').insertAdjacentHTML('beforeend',renderSearch());setTimeout(()=>{const i=document.getElementById('s-inp');if(i)i.focus();},50);}
  requestAnimationFrame(()=>{drawChart();setupSwipe();});
}

function setupSwipe(){
  document.querySelectorAll('.frow').forEach(row=>{
    let sx=0,cx=0,sw=false;
    const inner=row.querySelector('.frow-inner');if(!inner)return;
    row.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sw=true;},{passive:true});
    row.addEventListener('touchmove',e=>{if(!sw)return;cx=e.touches[0].clientX-sx;if(Math.abs(cx)>10)inner.style.transform=`translateX(${Math.min(Math.max(cx,-80),80)}px)`;},{passive:true});
    row.addEventListener('touchend',()=>{if(cx>60)row.click();inner.style.transform='';sw=false;cx=0;});
  });
}

// ══════════════════ ACTIONS ══════════════════
window.setTab=t=>set({tab:t});
window.setDay=i=>set({day:i});
window.toggleFood=key=>{
  const c={...S.checked};c[key]=!c[key];set({checked:c});
  const day=key.split('__')[0];
  if(dayProg(day)===100&&S.day===todayIdx())confetti();
  else if(c[key]&&navigator.vibrate)navigator.vibrate(10);
};
window.toggleShop=key=>{const c={...S.shopCk};c[key]=!c[key];set({shopCk:c});};
window.clearShop=()=>set({shopCk:{}});
window.dismissInstall=()=>set({showInstall:false});
window.toggleRecipe=key=>{const e={...S.exp};e[key]=!e[key];set({exp:e});};
window.setFinDate=d=>set({finDate:d});
window.updateFinForm=(k,v)=>set({finForm:{...S.finForm,[k]:v}});
window.prevMonth=()=>{const d=new Date(S.finDate+'T00:00:00');d.setDate(1);d.setMonth(d.getMonth()-1);set({finDate:`${d.getFullYear()}-${p2(d.getMonth()+1)}-01`});};
window.nextMonth=()=>{const d=new Date(S.finDate+'T00:00:00');d.setDate(1);d.setMonth(d.getMonth()+1);set({finDate:`${d.getFullYear()}-${p2(d.getMonth()+1)}-01`});};
window.addPurchase=()=>{
  const f=S.finForm;if(!f.name.trim()||!f.val||isNaN(parseFloat(f.val)))return;
  set({purchases:[...S.purchases,{id:Date.now().toString(),date:S.finDate,name:f.name.trim(),cat:f.cat,val:parseFloat(f.val)}],finForm:{name:'',cat:FCATS[0],val:''}});
  setTimeout(()=>{const el=document.getElementById('fn');if(el)el.focus();},50);
};
window.deletePurchase=id=>set({purchases:S.purchases.filter(p=>p.id!==id)});
window.saveMeta=()=>{const el=document.getElementById('meta-inp');if(el&&!isNaN(parseFloat(el.value)))set({finMeta:parseFloat(el.value),finMetaEdit:false});};
window.addWeight=()=>{
  const v=parseFloat(S.wIn);if(isNaN(v)||v<30||v>300)return;
  const td=today(),filtered=S.weights.filter(w=>w.date!==td);
  set({weights:[...filtered,{date:td,val:v}].sort((a,b)=>a.date.localeCompare(b.date)),wIn:''});
};
window.deleteWeight=date=>set({weights:S.weights.filter(w=>w.date!==date)});
window.setEvalOpt=(k,v)=>set({evalForm:{...S.evalForm,[k]:v}});
window.saveEval=()=>{
  const f=S.evalForm;if(!f.humor&&!f.energia&&!f.fome&&!f.nota)return;
  set({evals:{...S.evals,[S.evalDay]:{...f}},evalForm:{humor:'',energia:'',fome:'',nota:''}});
};
window.adjPrep=(name,d)=>{const s={...S.prepStock};s[name]=Math.max(0,(s[name]||0)+d);set({prepStock:s});};
window.clearPrep=()=>set({prepStock:{}});
window.set=set;

document.addEventListener('keydown',e=>{
  if(S.showSearch){if(e.key==='Escape')set({showSearch:false,searchQ:''});return;}
  const tabs=['dashboard','dieta','compras','receitas','financeiro'];
  if(e.key>='1'&&e.key<='5'&&!e.metaKey&&!e.ctrlKey&&document.activeElement.tagName!=='INPUT')set({tab:tabs[+e.key-1]});
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&S.tab==='dieta'&&document.activeElement.tagName!=='INPUT')set({day:((S.day+(e.key==='ArrowLeft'?-1:1))+7)%7});
  if(e.key==='f'&&(e.metaKey||e.ctrlKey)){e.preventDefault();set({showSearch:true});}
});

render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
